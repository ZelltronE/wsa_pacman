name: wsa_pacman
description: A GUI package manager and package installer for Windows Subsystem for Android (WSA).

publish_to: 'none'

version: 1.6.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_ui: ^4.12.0
  shared_value: ^2.1.2
  synchronized: ^3.1.0
  provider: ^6.1.2
  system_theme: ^2.3.1
  bitsdojo_window:
    path: packages/bitsdojo_window/bitsdojo_window
  smooth_scroll_multiplatform:
    git: https://github.com/alesimula/dyn_mouse_scroll.git
  flutter_acrylic: ^1.1.4
  url_strategy: ^0.2.0
  yaml: ^3.1.2
  archive: ^3.6.1
  path: ^1.9.0
  jovial_svg:
    git: https://github.com/alesimula/jovial_svg.git
  protobuf: ^3.1.0
  win32: ^5.5.0
  base32: ^2.1.4
  charset: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  math_expressions: ^3.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/missing_icon_background.si
    - assets/icons/missing_icon_foreground.si
    - assets/icons/missing_icon_legacy.si
    - assets/images/logo.png
    - assets/fonts/materialdesignicons.ttf
  fonts:
    - family: MaterialDesignIcons
      fonts:
        - asset: assets/fonts/materialdesignicons.ttf
